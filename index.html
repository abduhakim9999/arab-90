<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Араб тили</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap">
<script src="tg.js"></script>
<style>
:root{--bg:#f6f3ec;--cd:#fff;--tx:#1e2a26;--mu:#6b756f;--ac:#0f766e;--bd:#e0dccf;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171a;--cd:#19242a;--tx:#e8efec;--mu:#93a29b;--ac:#2dd4bf;--bd:#2a3a41;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#10171a;--cd:#19242a;--tx:#e8efec;--mu:#93a29b;--ac:#2dd4bf;--bd:#2a3a41;--ok:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.hd img{width:48px;height:48px;border-radius:12px}
.hd h1{font-size:22px;margin:0}
.hd p{margin:2px 0 0;font-size:14px;color:var(--mu)}
.ls{display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;color:inherit;text-decoration:none}
.it:active{transform:scale(.99)}
.nm{width:44px;height:44px;flex-shrink:0;border-radius:10px;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.mid{flex:1;min-width:0}
.t{font-size:16px;font-weight:600}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:21px;line-height:1.6;color:var(--mu)}
.pg{font-size:13px;color:var(--mu);margin-top:2px}
.pg.ok{color:var(--ok)}
.bar{height:4px;border-radius:4px;background:var(--bd);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.add{display:none;width:100%;margin-top:18px;padding:12px;border-radius:12px;border:1px dashed var(--ac);background:transparent;color:var(--ac);font:inherit;font-size:15px;cursor:pointer}
.add.on{display:block}
.tip{display:none;font-size:13px;color:var(--mu);text-align:center;margin-top:10px;line-height:1.5}
.tip.on{display:block}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.cd{border-radius:18px;padding:14px;min-height:148px;display:flex;flex-direction:column;gap:5px;text-decoration:none;color:inherit;background:var(--cd);border:1px solid var(--bd)}
.cd.a{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.cd svg{width:30px;height:30px}
.cd .n{font-size:18px;font-weight:700}
.cd .s{font-size:13px;opacity:.85}
.cd .sp{flex:1}
.cd.a .bar{background:rgba(255,255,255,.3)}
.cd.a .bar i{background:var(--bg)}
.soon{align-self:flex-start;font-size:12px;font-weight:700;color:#9a3412;background:#fde7dc;border-radius:8px;padding:4px 8px}
.sec{font-size:13px;font-weight:700;color:var(--mu);letter-spacing:.04em;margin:0 0 8px}
.cont{margin-bottom:18px}
.cont .it .go{color:var(--mu);font-size:22px}
.first .an{animation:rise .45s both}
.first .bar i{animation:fill .9s .5s cubic-bezier(.2,.8,.2,1) both}
.first .soon{animation:glow 2.4s 1.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w first" id="w">
  <div class="hd an"><img src="icon-192.png" alt=""><div><h1>Араб тили</h1><p>Матнлар ва феъллар</p></div></div>
  <div id="top"></div>
  <div class="sec an" id="ms" style="animation-delay:.3s">МАТНЛАР</div>
  <div class="ls" id="ls"></div>
  <button class="add an" id="add">Бош экранга қўшиш</button>
  <div class="tip" id="tip">iPhone'да: пастдаги «Улашиш» тугмаси → «На экран Домой / Add to Home Screen»</div>
</div>
<script>
var LESSONS=[{"n": 70, "uz": "Асалда шифо", "ar": "فِي الْعَسَلِ شِفَاءٌ", "key": "dars70-holat", "q": 22}, {"n": 91, "uz": "Аёл кишининг ишлаши", "ar": "عَمَلُ الْمَرْأَةِ", "key": "dars91-holat", "q": 30}, {"n": 92, "uz": "Ишлаш учун четга кетиш", "ar": "الِاغْتِرَابُ لِلْعَمَلِ", "key": "dars92-holat", "q": 17}];
function prog(raw,q){
  try{var S=JSON.parse(raw||"{}")||{};}catch(e){return null}
  if(S.qr)return {done:1,n:q};
  var n=0;if(S.q&&S.q.ch)S.q.ch.forEach(function(c){if(c!=null&&c!==false&&c!=="")n++});
  return {done:0,n:n,open:!!(S.pos||S.at||S.tab)};
}
var IC1='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 10h14M5 14h10M5 18h7"/></svg>';
var IC2='<svg viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>';
function item(L,txt,cls,w,d){
  return '<a class="it an" style="animation-delay:'+d+'s" href="'+L.n+'.html"><div class="nm">'+L.n+'</div><div class="mid"><div class="t">'+L.uz+'</div><div class="ar">'+L.ar+'</div><div class="pg'+cls+'">'+txt+'</div><div class="bar"><i style="width:'+w+'%"></i></div></div></a>';
}
/* Феъллар (natijalar feellar.html'dan) */
var FNS=10,FCL=null;
function flCard(){
  var b={};try{b=JSON.parse(localStorage.getItem("fl200_best")||"{}")||{}}catch(e){}
  if(FCL){try{var c=JSON.parse(FCL).best||{};for(var k in c)if(b[k]==null||c[k]>b[k])b[k]=c[k]}catch(e){}}
  var n=Object.keys(b).length,txt=n?(n>=FNS?"✓ "+FNS+" / "+FNS+" қисм":"Қисмлар: "+n+" / "+FNS):"200 феъл · "+FNS+" қисм";
  return '<a class="cd an" style="animation-delay:.16s" href="feellar.html">'+IC2+'<div class="n">Феъллар</div><div class="s">'+txt+'</div><div class="sp"></div><div class="bar"><i style="width:'+Math.round(Math.min(n,FNS)*100/FNS)+'%;background:#c2410c"></i></div></a>';
}
var LC=null;
function render(cloud){
  if(cloud)LC=cloud;else cloud=LC;
  var h="",sum=0,last=null,lastH="";
  try{last=localStorage.getItem("oxirgi-dars")}catch(e){}
  LESSONS.forEach(function(L,i){
    var raw=null;try{raw=localStorage.getItem(L.key)}catch(e){}
    if(cloud&&cloud[L.key]){try{var c=JSON.parse(cloud[L.key]);var lt=+(localStorage.getItem(L.key+"-t")||0);if(c.t>lt)raw=c.v}catch(e){}}
    var p=prog(raw,L.q),txt="Янги",cls="",w=0;
    if(p&&p.done){txt="✓ Машқ тугатилган";cls=" ok";w=100}
    else if(p&&p.n){txt="Машқ: "+p.n+" / "+L.q;w=Math.round(p.n*100/L.q)}
    else if(p&&p.open)txt="Бошланган";
    sum+=w;
    h+=item(L,txt,cls,w,(.36+i*.06).toFixed(2));
    if(String(L.n)===last)lastH=item(L,txt,cls,w,.24);
  });
  var avg=LESSONS.length?Math.round(sum/LESSONS.length):0;
  var t='<div class="cards">'+
    '<a class="cd a an" style="animation-delay:.08s" href="#ms">'+IC1+'<div class="n">Матнлар</div><div class="s">'+LESSONS.length+' дарс · аудио, эъроб</div><div class="sp"></div><div class="bar"><i style="width:'+avg+'%"></i></div></a>'+
    flCard()+
    '</div>';
  if(lastH)t+='<div class="sec an" style="animation-delay:.2s">ДАВОМ ЭТИШ</div><div class="cont">'+lastH+'</div>';
  document.getElementById("top").innerHTML=t;
  document.getElementById("ls").innerHTML=h;
}
setTimeout(function(){document.getElementById("w").classList.remove("first")},2000);
render();
var add=document.getElementById("add"),tip=document.getElementById("tip"),dp=null;
/* Telegram ichida */
function onTg(){
  var w=Telegram.WebApp;
  if(w.CloudStorage&&w.isVersionAtLeast("6.9")){
    w.CloudStorage.getItems(LESSONS.map(function(L){return L.key}),function(e,v){if(!e&&v)render(v)});
    w.CloudStorage.getItem("fl200_sync",function(e,v){if(!e&&v){FCL=v;render()}});
  }
  if(w.isVersionAtLeast("8.0")&&w.addToHomeScreen){
    var show=function(){add.classList.add("on");add.onclick=function(){w.addToHomeScreen()}};
    if(w.checkHomeScreenStatus)w.checkHomeScreenStatus(function(s){if(s!=="added"&&s!=="unsupported")show()});else show();
    w.onEvent&&w.onEvent("homeScreenAdded",function(){add.classList.remove("on")});
  }
}
if(document.documentElement.classList.contains("in-tg"))onTg();else document.addEventListener("tgready",onTg);
/* oddiy brauzerda (Android Chrome) */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;add.classList.add("on");add.onclick=function(){dp.prompt();dp.userChoice.then(function(){add.classList.remove("on")})}});
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
setTimeout(function(){if(ios&&!standalone&&!document.documentElement.classList.contains("in-tg"))tip.classList.add("on")},800);
window.addEventListener("pageshow",function(){render()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
