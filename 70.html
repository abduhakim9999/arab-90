var QT={"MUBXAB": ["Мубтадо ва хабар", ["Исмий гап икки қисмдан иборат: мубтадо (кимдан/нимадан гап кетяпти) ва хабар (у ҳақида нима дейиляпти). Иккаласи ҳам раф қилинади: الْمَالُ كَثِيرٌ.", "Мубтадо одатда маърифа бўлади (ال билан, алам, замир ёки изофада), хабар кўпинча накра бўлади.", "Хабар уч хил бўлади: муфрад (كَثِيرٌ), жумла (بِلَادُنَا تَحْتَاجُ إِلَيْنَا) ва шибҳи жумла, яъни жар ҳарфи ва мажрур ёки зарф (وَإِلَيْهِ النُّشُورُ).", "Шибҳи жумла хабар олдинга ўтиши мумкин; бу «фақат» маъносини беради: وَإِلَيْهِ النُّشُورُ — «қайта тирилиш фақат Унинг ҳузурига». Мубтадо накра бўлса, хабарни олдинга ўтказиш вожиб: فِي الْبَيْتِ رَجُلٌ.", "Кўпчилик наҳвчилар фикрича мубтадони ибтидо (маънавий омил), хабарни эса мубтадо раф қилади.", "Сарлавҳалардаги исмлар хабари ёки мубтадоси маҳзуф деб таркиб қилинади: (هَذَا) الدَّرْسُ الثَّانِي."]], "NASB": ["Музорийни насб қилувчи ҳарфлар", ["Музорийни насб қилувчи ҳарфлар: أَنْ، لَنْ، كَيْ، إِذَنْ.", "لَنْ — келаси замонни инкор қилади: لَنْ أَذْهَبَ «бормайман».", "أَنْ — масдарий ҳарф: феъл билан бирга масдар ҳосил қилади: أَرْجُو أَنْ تَعُودَ = أَرْجُو عَوْدَتَكَ.", "Насб аломати — фатҳа; амсилатул хомсада — нуннинг ҳазф бўлиши: لَنْ تَذْهَبُوا.", "Маҳзуф أَنْ билан ҳам насб қилинади: لِ (сабаб), حَتَّى, сабабият фа си ва бошқалардан кейин: جِئْتُ لِأَتَعَلَّمَ."]], "MUDRAF": ["Музорийнинг рафи", ["Музорий феъли уни насб ёки жазм қилувчи сўз бўлмаса раф қилинади.", "Раф аломати — замма: أَعُودُ، تَعْمَلُ.", "Охири و ёки ي бўлса, замма оғир бўлгани учун айтилмайди (тақдирий): أَرْجُو، أَمْشِي; лекин фатҳа кўринади: لَنْ أَرْجُوَ.", "Амсилатул хомсада раф аломати — нуннинг жойида туриши: تَعْمَلُونَ، تَعْمَلِينَ.", "Жазм қилувчилар: لَمْ، لَمَّا، амр ломи، наҳй لَا си ва шарт сўзлари (إِنْ، مَنْ، مَا…)."]], "SIN": ["سَ ва سَوْفَ", ["سَ ва سَوْفَ — истиқбол ҳарфлари: музорийни келаси замонга хослайди.", "سَ — яқин келажак, سَوْفَ — узоқроқ келажак учун: سَأُسَافِرُ، سَوْفَ أُسَافِرُ.", "Улар амал қилмайди — феъл раф қилинганича қолади: سَأَغْتَرِبُ."]], "MOZI": ["Мозий феълнинг биноси", ["Мозий феъл доим мабний; асли — фатҳага: فَكَّرَ، قَالَ.", "Ҳаракатли бориз фоил замири (تُ، تَ، تِ، نَا، نَ) уланса — сукунга: فَكَّرْتُ، فَكَّرْتَ.", "Жам вови уланса — заммага: اغْتَرَبُوا.", "Охири алиф бўлса, фатҳа тақдирий: تَعَالَى، سَعَى."]], "TAALA": ["تَعَالَى", ["Охири алиф бўлган сўзда ҳаракат айтилмайди — тақдирий (сабаби: таъаззур, яъни талаффуз имконсиз).", "Охири و ёки ي бўлганда эса сабаби — сақал (оғирлик): أَرْجُو، الثَّانِي.", "Аллоҳ номидан кейин ҳурмат учун айтилади: تَعَالَى، عَزَّ وَجَلَّ، سُبْحَانَهُ."]], "SIFAT": ["Сифат (наът)", ["Сифат мавсуфига тўрт нарсада эргашади: эъроб, маърифа/накра, жинс (музаккар/муаннас), сон.", "Мисол: الدَّرْسُ الثَّانِي، اللَّهُ الْعَظِيمُ.", "Ақлсиз нарсаларнинг кўплигига сифат муаннас бирликда келади: بِلَادٍ غَرِيبَةٍ."]], "MUTLAQ": ["Мафъулун мутлақ", ["Феълнинг ўз масдари: феълни таъкидлайди, турини ёки сонини билдиради: شَكَرْتُهُ شُكْراً.", "Феъли кўпинча ҳазф қилинади: شُكْراً، عَفْواً، صَبْراً، حَمْداً.", "Унинг ўрнига ўтадиганлар (наиб): сон (مَرَّتَيْنِ), كُلٌّ ва بَعْضٌ (كُلَّ الشُّكْرِ), сифати."]], "PRON": ["Муттасил замирлар", ["Замирлар доим мабний; ўрни қаерга уланганига қараб:", "• исмга — музофун илайҳ, жар ўринда: رَاتِبُكَ", "• феълга — мафъулун биҳ, насб ўринда: أَزُورُهُمْ (ёки бориз фоил замири: فَكَّرْتُ، اغْتَرَبُوا)", "• жар ҳарфига — мажрур, жар ўринда: إِلَيْنَا، فِيكَ", "• إِنَّ синглисига — унинг исми, насб ўринда: لَكِنَّكَ", "هُ، هُمْ، هُمَا، هُنَّ — касра ёки ي дан кейин касра олади: رِزْقِهِ، دِينِهِمْ، فِيهِمْ."]], "IDAFA": ["Изофа", ["Музоф танвин ва ال олмайди: خَارِجَ وَطَنِي، خَمْسَ سَنَوَاتٍ.", "Музофун илайҳ доим жар қилинади.", "Музофнинг ўз эъроби гапдаги ўрнига қараб (мубтадо, фоил, зарф…)."]], "ZARF": ["Зарф (мафъулун фийҳ)", ["Иш-ҳаракатнинг вақти ёки жойини билдиради, «-да» маъносини беради; насб қилинади.", "Зарф замон: يَوْمَ، لَيْلَةَ، صَبَاحاً; зарф макон: خَارِجَ، أَمَامَ، فَوْقَ، عِنْدَ، مَعَ.", "Баъзи зарфлар мабний: هُنَا، هُنَاكَ، إِذَا، حَيْثُ — насб ўринда.", "Зарф ўрнига ўтадиганлар: сон (خَمْسَ سَنَوَاتٍ), зарфнинг сифати (طَوِيلاً — асли زَمَناً طَوِيلاً), كُلٌّ ва بَعْضٌ.", "Зарф ҳамда жар ҳарфи ва мажрур бирор феълга ёки феълдек амал қиладиган сўзга боғланади (мутааллиқ)."]], "ISHARA": ["Исм ишоралар", ["Яқин учун: هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ.", "Узоқ учун: ذَلِكَ، تِلْكَ، أُولَئِكَ.", "ذَلِكَ = ذَا + لِ (узоқлик ломи) + كَ (хитоб ҳарфи).", "Жой учун: هُنَا (бу ерда)، هُنَاكَ / هُنَالِكَ (у ерда).", "هَذَانِ ва هَاتَانِ тасниядек турланади, қолганлари мабний."]], "JARR": ["Жар ҳарфлари", ["Ўзидан кейинги исмни жар қилади: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِ، لِ، كَ، حَتَّى، رُبَّ، مُنْذُ.", "إِلَى ва عَلَى замирга уланганда алиф ي га айланади: إِلَيْهِ، عَلَيْكَ.", "لِ замир билан фатҳа олади: لَكَ، لَهُ، لَكُمْ (фақат ي билан: لِي).", "لِ + ال: алиф ёзилмайди — لِلْعَمَلِ.", "Жар ҳарфи ва мажрур бирор феълга ёки феълга ўхшаш сўзга боғланади (мутааллиқ); бундай сўз бўлмаса — маҳзуф (ҳазф қилинган) сўзга (хабар, сифат ёки ҳол бўлиб)."]], "HAL": ["Ҳол", ["Иш пайтидаги ҳолатни билдиради, «қандай?» саволига жавоб беради; насб қилинади.", "Ҳол кўпинча накра, зул ҳол эса маърифа бўлади.", "Битта зул ҳолга бир нечта ҳол келиши мумкин: تَعُودَ سَالِماً غَانِماً.", "Ҳол жумла ҳам бўлади: جَاءَ وَهُوَ يَضْحَكُ.", "كَيْفَ — тўлиқ феълдан олдин келса ҳол (كَيْفَ تُحَافِظُ؟), мубтадодан олдин келса хабар (كَيْفَ حَالُكَ؟)."]], "ISTIF": ["Савол сўзлари", ["Ҳарфлар: هَلْ ва ҳамза (أَ). هَلْ нинг жавоби — نَعَمْ ёки لَا.", "Исмлар: مَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيُّ — гапда ўрни бор (мубтадо, хабар, ҳол, мафъулун биҳ…).", "Савол исмлари мабний, фақат أَيُّ мўъроб."]], "MAWSUL": ["Исм мавсул", ["الَّذِي، الَّتِي، اللَّذَانِ، اللَّتَانِ، الَّذِينَ، اللَّاتِي; умумий: مَنْ، مَا.", "Ўзидан кейинги жумла — сила, эъробдан унга ўрин йўқ.", "Силада мавсулга қайтувчи замир бўлади: هُوَ الَّذِي جَعَلَ — جَعَلَ даги мустатир هُوَ.", "اللَّذَانِ ва اللَّتَانِ тасниядек мўъроб, қолганлари мабний."]], "DAMIR": ["Мунфасил замирлар", ["أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.", "Ҳаммаси мабний; гапда раф ўринда келади (мубтадо, хабар…).", "Насб ўрни учун إِيَّا билан: إِيَّاكَ نَعْبُدُ."]], "DUA": ["Дуо маъносидаги мозий", ["Мозий феъл дуо маъносида келади: بَارَكَ اللَّهُ فِيكَ، رَحِمَهُ اللَّهُ، رَضِيَ اللَّهُ عَنْهُ.", "Бундай жумла жумлатун дуоийя дейилади (7-дарс), эъробдан унга ўрин йўқ."]], "LAMJ": ["لَمْ — жазм ҳарфи", ["لَمْ музорий феълини жазм қилади ва маъносини ўтган замон инкорига айлантиради: يَذْهَبُ — боради, لَمْ يَذْهَبْ — бормади.", "Жазм аломати — сукун: لَمْ أَذْهَبْ، لَمْ أَسْمَعْ. Амсилатул хомсада — нуннинг ҳазф бўлиши: لَمْ يَذْهَبُوا.", "Охири иллат ҳарфи бўлса, у тушади: يَمْشِي → لَمْ يَمْشِ، يَدْعُو → لَمْ يَدْعُ.", "مَا ذَهَبَ ҳам «бормади» маъносини беради, лекин мозий феъли билан келади ва жазм қилмайди."]], "AKH": ["Беш исм (أَخٌ، أَبٌ …)", ["أَبٌ، أَخٌ، حَمٌ، فُو، ذُو — музоф бўлганда ҳарф билан турланади:", "Рафда و: جَاءَ أَخُوهُ; насбда ا: أَمَرَ أَخَاهُ; жарда ي: مَرَرْتُ بِأَخِيهِ.", "Музоф бўлмаса, одатдаги ҳаракат билан турланади: هَذَا أَخٌ."]], "MULHAQ": ["Жам музаккар солимга мулҳақ сўзлар", ["Ўнликлар (عِشْرُونَ … تِسْعُونَ), шунингдек أُولُو، أَهْلُونَ، سِنُونَ، بَنُونَ жам музаккар солимдек турланади.", "Рафда و, насб ва жарда ي: جَاءَ عِشْرُونَ، رَأَيْتُ عِشْرِينَ.", "Тартиб сонлари: الْحَادِي وَالْعِشْرُونَ … الثَّانِي وَالتِّسْعُونَ — бирлик فَاعِلٍ вазнида, ўнлик و билан атф қилинади."]]};
