:root{--bg:#f6f3ec;--cd:#fff;--tx:#1e2a26;--mu:#6b756f;--ac:#0f766e;--ai:#fff;--as:#e1f0ed;--bd:#e0dccf;--ok:#15803d;--oks:#e3f3e7;--bad:#b42318;--bads:#fbe4e1;--gold:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171a;--cd:#19242a;--tx:#e8efec;--mu:#93a29b;--ac:#2dd4bf;--ai:#10171a;--as:#163634;--bd:#2a3a41;--ok:#4ade80;--oks:#173325;--bad:#f87171;--bads:#3b2224;--gold:#f0b94a}}
:root[data-theme="dark"]{--bg:#10171a;--cd:#19242a;--tx:#e8efec;--mu:#93a29b;--ac:#2dd4bf;--ai:#10171a;--as:#163634;--bd:#2a3a41;--ok:#4ade80;--oks:#173325;--bad:#f87171;--bads:#3b2224;--gold:#f0b94a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:520px;margin:0 auto;padding:18px 16px 48px}
.hd{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.lg{width:48px;height:48px;flex-shrink:0;border-radius:12px;background:var(--ac);color:var(--ai);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.hd h1{font-size:22px;margin:0}
.hd p{margin:2px 0 0;font-size:14px;color:var(--mu)}
h2{font-size:20px;margin:0 0 12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 12px}
.ar{font-family:"Sch","Noto Naskh Arabic",serif;font-feature-settings:"cv62" 1;direction:rtl;unicode-bidi:isolate;line-height:2.25}
.big{font-size:3.4rem;text-align:center;margin:2px 0}
.mid{font-size:2.1rem}
.mn{font-size:1.05rem}
.c{text-align:center}
.lbl{color:var(--mu);font-size:.85rem}
.note{font-size:.9rem;color:var(--mu)}
.note a{color:var(--ac)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-align:center;margin:0 0 10px;-webkit-tap-highlight-color:transparent}
.btn.pri{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.btn:active,.set:active,.opt:active{transform:scale(.99)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;white-space:nowrap;padding-left:8px;padding-right:8px}
.big-btn{font-size:1.15rem;padding:17px}
.back{background:none;border:none;color:var(--ac);font:inherit;font-size:1.5rem;font-weight:600;padding:2px 0;min-width:44px;text-align:left;cursor:pointer;margin:0 0 6px;text-decoration:none;display:inline-block}
.in-tg .nav{display:none}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
.set{display:block;min-height:88px;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.set b{display:block;font-size:1.05rem}
.set>span{display:block;min-height:1.4em}
.set .rng{font-size:.8rem;color:var(--mu)}
.set.done{border-color:var(--ok);background:var(--oks)}
.set.cur{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.star{color:var(--gold);letter-spacing:1px;white-space:nowrap}.st0{color:var(--bd)}
.bigstar{font-size:2.6rem;margin:6px 0}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:.9rem;margin:0 0 8px;gap:8px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:0 0 14px}
.bar>i{display:block;height:100%;background:var(--ac)}
.stage{display:inline-block;background:var(--as);color:var(--ac);font-weight:700;font-size:.92rem;padding:5px 12px;border-radius:10px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:right;padding:12px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;cursor:pointer;margin:0 0 12px;-webkit-tap-highlight-color:transparent}
.opt.plain{text-align:left;padding:16px}
.opt .mn{font-size:1.08rem}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.bad{border-color:var(--bad);background:var(--bads)}
.opt:disabled{cursor:default;color:var(--tx);opacity:1}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:2rem;line-height:1.9;text-align:center}
.fr>span{display:flex;align-items:center;justify-content:center;border-left:1px dashed var(--bd);padding:0 2px}
.fr>span:last-child{border-left:none}
.fr-head{display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;color:var(--mu);font-size:.8rem;margin-bottom:-6px;text-align:center}
.opt.bad .df{box-shadow:inset 0 0 0 2px var(--bad);border-radius:8px}.opt.ok .df{box-shadow:inset 0 0 0 2px var(--ok);border-radius:8px}
.fb{padding:12px 14px;border-radius:12px;margin:0 0 12px;font-weight:600}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--bads);color:var(--bad)}
details summary{cursor:pointer;font-weight:600;margin:0 0 8px}
.mist{border-top:1px solid var(--bd);padding:10px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:.85rem}
tr.me td{background:var(--as)}
.parts{font-size:.8rem;color:var(--mu);margin-top:2px;line-height:1.4}
input[type=search]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;margin:0 0 12px;-webkit-appearance:none;appearance:none}
input[type=search]:focus{outline:2px solid var(--ac);outline-offset:-1px}
.lx{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:8px 14px 12px;margin:0 0 10px;content-visibility:auto;contain-intrinsic-size:auto 150px}
.lx-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lx-n{color:var(--mu);font-size:.8rem;white-space:nowrap}

  set(k, v){ try{ localStorage.setItem(SKEY + k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(SKEY + k); }catch(e){} }
};
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const meaning = it => it.me.join('  •  ');
const setRange = s => [s * SET_SIZE, Math.min(TOTAL, (s + 1) * SET_SIZE)];
const setIdx = s => { const [a, b] = setRange(s), r = []; for (let i = a; i < b; i++) r.push(i); return r; };
const okI = i => Number.isInteger(i) && i >= 0 && i < TOTAL;
const starN = b => b >= 90 ? 5 : b >= 75 ? 4 : b >= 60 ? 3 : b >= 40 ? 2 : 1;   // 100 ball → yulduz
const stars = b => '<span class="star">' + '★'.repeat(starN(b)) + '<span class="st0">' + '★'.repeat(5 - starN(b)) + '</span></span>';
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
let SCREEN = 'home';

/* ---------- NOTO'G'RI VARIANTLAR ---------- */
const STOP = new Set(['қилм','бўлм','берм','олмо','келм','кетм','бери','қили','қилд','бўлд','берд','олди','келд','кетд','этди','этмо']);
function stems(s){ const r = new Set(); (s.toLowerCase().match(/[а-яёўқғҳ]+/g) || []).forEach(w => { if (w.length >= 4){ const st = w.slice(0, 4); if (!STOP.has(st)) r.add(st); } }); return r; }
function atoms(s){ return new Set(s.toLowerCase().split(/\s*\d\.\s*|•|;|,|—/).map(x => x.replace(/[().…]/g, '').replace(/\s+/g, ' ').trim()).filter(x => x.length > 1)); }
function overlap(a, b){ if (a === b) return true; const A = stems(a); for (const x of stems(b)) if (A.has(x)) return true;
  const P = atoms(a); for (const x of atoms(b)) if (P.has(x)) return true; return false; }
const baseM = m => m.replace(/\s*\.{2,}\s*$/, '');   // أَخَذَ va أَخَذَ ... bir-biriga variant bo'lmasin
function otherMeanings(idx, k){
  const mine = meaning(ITEMS[idx]); const out = [];
  for (const j of shuffle(ITEMS.map((_, i) => i))){
    if (j === idx || baseM(ITEMS[j].m) === baseM(ITEMS[idx].m)) continue; const m = meaning(ITEMS[j]);
    if (overlap(mine, m) || out.some(x => overlap(x, m))) continue;
    out.push(m); if (out.length === k) break;
  }
  return out;
}
const hasForms = i => !!ITEMS[i].mu;
function similarItems(idx, k){
  const it = ITEMS[idx], pre = it.mu.slice(0, 2), len = it.mu.length;
  const sc = j => (ITEMS[j].mu.slice(0, 2) === pre ? 0 : 2) + Math.abs(ITEMS[j].mu.length - len) / 4 + Math.random();
  return ITEMS.map((_, j) => j).filter(j => j !== idx && hasForms(j) && ITEMS[j].mu !== it.mu)
    .map(j => [j, sc(j)]).sort((a, b) => a[1] - b[1]).slice(0, k).map(x => x[0]);
}
// ma'no savoli: moziy beriladi, 3 ma'nodan biri
function tqMeaning(idx){
  const right = meaning(ITEMS[idx]);
  const opts = shuffle([right, ...otherMeanings(idx, 2)]);
  return { i: idx, k: 'm', o: opts.map(m => ({ me: m })), a: opts.indexOf(right) };
}
// sig'a savoli: noto'g'ri qatorlarda bitta shakl o'zgartirilgan
function tqForms(idx){
  const it = ITEMS[idx];
  const base = { mu: it.mu, am: it.am, ms: it.ms };
  const keys = shuffle(Object.keys(it.v)), wrong = [];
  keys.forEach(k => { const o = Object.assign({}, base); o[k] = it.v[k]; wrong.push(o); });
  if (wrong.length < 2 && keys.length >= 2){ const o = Object.assign({}, base); keys.slice(0, 2).forEach(k => o[k] = it.v[k]); wrong.push(o); }
  if (wrong.length < 2) similarItems(idx, 2 - wrong.length).forEach(j => wrong.push({ mu: ITEMS[j].mu, am: ITEMS[j].am, ms: ITEMS[j].ms }));
  const sh = shuffle([base, ...wrong.slice(0, 2)]);
  return { i: idx, k: 's', o: sh, a: sh.indexOf(base) };
}
function makeTestQs(p){
  const ids = setIdx(p);
  return [...shuffle(ids).map(tqMeaning), ...shuffle(ids.filter(hasForms)).map(tqForms)];
}

/* ---------- KO'RINISH BO'LAKLARI ---------- */
const STAGES = { m: '1 · Маъноси', s: '2 · Сийғаси' };
const formsOnly = o => `<span class="fr ar"><span>${esc(o.mu)}</span><span>${esc(o.am)}</span><span>${esc(o.ms)}</span></span>`;
const plainMn = m => `<span class="mn">${esc(m)}</span>`;
const correctBlock = it => `<div class="ar mid c">${esc(it.m)}</div>${it.mu ? formsOnly(it) : ''}<div class="mn" style="margin-top:6px">${esc(meaning(it))}</div>`;
function optHtml(q, o){
  if (!o) return '<span class="mn">— жавоб берилмади —</span>';
  return q.k === 'm' ? plainMn(o.me) : formsOnly(o);
}
function diffHtml(q, o, ref){
  if (!o || q.k === 'm' || !ref) return optHtml(q, o);
  const c = f => o[f] !== ref[f] ? ' class="df"' : '';
  return `<span class="fr ar"><span${c('mu')}>${esc(o.mu)}</span><span${c('am')}>${esc(o.am)}</span><span${c('ms')}>${esc(o.ms)}</span></span>`;
}
const backBtn = () => '<button class="back nav" id="bk" aria-label="Орқага">←</button>';

/* ---------- TELEGRAM ---------- */
const TG = () => { const w = window.Telegram && Telegram.WebApp; return w && w.initData ? w : null; };
// Telegram ichidamizmi (Telegram skripti yuklanmagan bo'lsa ham)
const inTgEnv = () => { if (TG() || window.TelegramWebviewProxy) return true; try{ return !!sessionStorage.getItem('__telegram__initParams'); }catch(e){ return false; } };
const tgName = () => { const w = TG(), u = w && w.initDataUnsafe && w.initDataUnsafe.user;
  return u ? ([u.first_name, u.last_name].filter(Boolean).join(' ').trim() || u.username || '') : ''; };
function goBack(){
  if (SCREEN !== 'home') return home();
  try{ TG().BackButton.hide(); }catch(e){}
  location.replace('index.html');   // tarix yig'ilmasin (tg.js bilan bir xil)
}
function ask(msg, cb){
  const w = TG();
  if (w && w.showConfirm && w.isVersionAtLeast('6.2')){ try{ w.showConfirm(msg, ok => { if (ok) cb(); }); return; }catch(e){} }
  if (confirm(msg)) cb();
}
const canCloud = () => { const w = TG(); return w && w.CloudStorage && w.isVersionAtLeast('6.9') ? w : null; };
// yulduzlar va xatolar ro'yxati boshqa telefonda ham chiqishi uchun
function cloudPush(){
  store.set('t', Date.now());
  const w = canCloud(); if (!w) return;
  const p = JSON.stringify({ t: store.get('t', 0), best: store.get('best', {}), mist: store.get('mist', []) });
  if (p.length < 4000) try{ w.CloudStorage.setItem(SYNC_KEY, p); }catch(e){}
}
function cloudPull(){
  const w = canCloud(); if (!w) return;
  try{ w.CloudStorage.getItem(SYNC_KEY, (err, v) => {
    let c = null; try{ c = v ? JSON.parse(v) : null; }catch(e){}
    const best = store.get('best', {}); let changed = false, push = !c;
    if (c){
      const cb = c.best || {};
      Object.keys(cb).forEach(p => { const x = Number(cb[p]); if (+p >= 0 && +p < NSETS && isFinite(x) && (best[p] == null || x > best[p])){ best[p] = x; changed = true; } });
      Object.keys(best).forEach(p => { if (cb[p] == null || best[p] > cb[p]) push = true; });
      if (changed) store.set('best', best);
      if ((c.t || 0) > store.get('t', 0) && Array.isArray(c.mist)){ store.set('mist', c.mist.filter(okI)); store.set('t', c.t); changed = true; }
      else if ((c.t || 0) < store.get('t', 0)) push = true;
    }
    if (push && (Object.keys(best).length || store.get('mist', []).length)) cloudPush();
    if (changed && SCREEN === 'home') home();
  }); }catch(e){}
}

/* ---------- NATIJANI YUBORISH ---------- */
function fetchT(url, opt, ms){
  const c = window.AbortController ? new AbortController() : null;
  const tm = setTimeout(() => { if (c) c.abort(); }, ms || 20000);
  return fetch(url, Object.assign({ signal: c ? c.signal : undefined }, opt || {})).finally(() => clearTimeout(tm));
}
const ST = {
  wait: 'Натижа юборилмоқда…',
  ok: 'Натижа рейтингга ёзилди ✓',
  net: 'Интернет йўқ. Натижа сақланди, интернет чиққанда ўзи юборилади.',
  err: 'Натижа ҳозир юборилмади, кейинроқ яна юборилади.',
  bad: 'Натижа қабул қилинмади.',
  out: `Рейтингга ёзилиши учун <a href="${BOT_LINK}">Телеграм орқали очинг</a>.`
};
function setSt(id, k){ const s = document.getElementById('st'); if (s && s.dataset.id === String(id)) s.innerHTML = ST[k]; }
let FLUSHING = false;
async function flush(){
  const w = TG(); if (!w || FLUSHING) return;
  FLUSHING = true;
  try{
    for (;;){
      const q = store.get('q', []); if (!q.length) break;
      const it = q[0]; let r = null;
      try{
        const res = await fetchT(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: w.initData }, it)) });
        r = await res.json();
      }catch(e){ setSt(it.id, 'net'); break; }
      if (r && (r.ok || r.err === 'data')){   // yozildi yoki ma'lumot yaroqsiz — navbatdan chiqadi
        store.set('q', store.get('q', []).filter(x => x.id !== it.id));
        setSt(it.id, r.ok ? 'ok' : 'bad');
        continue;
      }
      setSt(it.id, 'err'); break;               // sozlama yoki server xatosi — keyin yana urinadi
    }
  } finally { FLUSHING = false; }
}

/* ---------- BOSH SAHIFA ---------- */
function home(){
  SCREEN = 'home';
  const best = store.get('best', {}), mist = store.get('mist', []), t = store.get('test', null);
  let parts = '';
  for (let p = 0; p < NSETS; p++){
    const sc = best[p], [a, b] = setRange(p), cur = t && t.part === p;
    parts += `<button class="set ${sc != null ? 'done' : ''} ${cur ? 'cur' : ''}" data-p="${p}">
      <b>${p + 1}-қисм</b><span class="rng">№ ${ITEMS[a].n[0]}–${ITEMS[b - 1].n[0]}</span>
      <span>${cur ? '▸ ' + t.pos + ' / ' + t.qs.length : sc != null ? stars(sc) : ''}</span></button>`;
  }
  $app.innerHTML = `
    <a class="back nav" href="index.html" aria-label="Дарслар">←</a>
    <div class="hd"><div class="lg ar">ف</div><div><h1>Феъллар</h1><p>${TOTAL} феъл · ${NSETS} қисм</p></div></div>
    <div class="sets">${parts}</div>
    <div class="row2"><button class="btn" id="bDc">📖 Луғат</button><button class="btn" id="bLb">🏆 Рейтинг</button></div>
    ${mist.length ? `<button class="btn" id="bMs">↻ Хатолар · ${mist.length}</button>` : ''}`;
  bDc.onclick = lugat; bLb.onclick = leaderboard;
  if (window.bMs) bMs.onclick = mistakes;
  $app.querySelectorAll('[data-p]').forEach(el => el.onclick = () => {
    const p = +el.dataset.p;
    if (t && t.part === p) return runQ('test');
    const go = () => { store.del('test'); begin(p); };
    if (t && t.pos > 0) return ask((t.part + 1) + '-қисмдаги бошланган тест ўчади. Давом этасизми?', go);
    go();
  });
  window.scrollTo(0, 0);
}
function begin(p){
  store.set('test', { part: p, qs: makeTestQs(p), pos: 0, ans: [], start: Date.now() });
  runQ('test');
}

/* ---------- TEST VA XATOLAR ---------- */
function runQ(key){
  SCREEN = 'sub';
  const t = store.get(key, null); if (!t) return home();
  if (t.pos >= t.qs.length) return key === 'test' ? finishTest(t) : finishReview(t);
  const again = () => runQ(key);
  const q = t.qs[t.pos], it = ITEMS[q.i];
  $app.innerHTML = `
    <div class="meta"><button class="back" id="bH" style="margin:0" aria-label="Чиқиш">✕</button>${key === 'rev' ? '<span class="lbl">↻ Хатолар</span>' : ''}<span>${t.pos + 1} / ${t.qs.length}</span></div>
    <div class="bar"><i style="width:${Math.round(t.pos * 100 / t.qs.length)}%"></i></div>
    <div class="stage">${q.k === 'm' ? STAGES.m : STAGES.s}</div>
    <div class="card c">${q.k === 's' ? '<div class="fr-head"><span>музореъ</span><span>амр</span><span>масдар</span></div>' : ''}<div class="ar big">${esc(it.m)}</div></div>
    <div id="ops"></div><div id="fb"></div>`;
  let locked = false;
  q.o.forEach((o, k) => {
    const b = document.createElement('button'); b.className = 'opt' + (q.k === 'm' ? ' plain' : ''); b.innerHTML = optHtml(q, o);
    b.onclick = () => {
      if (locked) return; locked = true;
      t.ans.push(k); t.pos++; store.set(key, t);
      const bs = ops.querySelectorAll('.opt'); bs.forEach(x => x.disabled = true);
      bs[q.a].classList.add('ok');
      if (k === q.a){ fb.innerHTML = '<div class="fb ok">Тўғри! ✓</div>'; setTimeout(() => { if (document.getElementById('fb') === fb) again(); }, 700); return; }
      bs[k].classList.add('bad');
      if (q.k === 's'){ bs[k].innerHTML = diffHtml(q, q.o[k], q.o[q.a]); bs[q.a].innerHTML = diffHtml(q, q.o[q.a], q.o[k]); }
      fb.innerHTML = `<div class="fb bad">Нотўғри. Тўғриси:</div><div class="card">${correctBlock(it)}</div><button class="btn pri" id="bGo">Давом этиш →</button>`;
      bGo.onclick = again; bGo.scrollIntoView({ block: 'nearest' });
    };
    ops.appendChild(b);
  });
  bH.onclick = home;
  window.scrollTo(0, 0);
}
function finishTest(t){
  while (t.ans.length < t.qs.length) t.ans.push(-1);
  const score = t.qs.reduce((s, q, k) => s + (t.ans[k] === q.a ? 1 : 0), 0);
  const secs = Math.round((Date.now() - t.start) / 1000);
  const wrongIdx = [...new Set(t.qs.filter((q, k) => t.ans[k] !== q.a).map(q => q.i))];
  const s100 = Math.round(score * 100 / t.qs.length);
  const best = store.get('best', {}); if (best[t.part] == null || s100 > best[t.part]){ best[t.part] = s100; store.set('best', best); }
  const mist = store.get('mist', []); wrongIdx.forEach(i => { if (!mist.includes(i)) mist.push(i); }); store.set('mist', mist);
  store.del('test');
  cloudPush();
  const res = { id: Date.now(), part: t.part, score, total: t.qs.length, seconds: secs, qs: t.qs, ans: t.ans, queued: false };
  if (inTgEnv()){
    const q = store.get('q', []);
    q.push({ id: res.id, part: t.part + 1, score, total: res.total, seconds: secs, wrong: wrongIdx.map(i => ITEMS[i].n[0] + ' ' + ITEMS[i].m) });
    store.set('q', q); res.queued = true;
  }
  showResult(res);
  flush();
}
function showResult(res){
  SCREEN = 'sub';
  const s100 = Math.round(res.score * 100 / res.total);
  const wrong = res.qs.map((q, k) => ({ q, k })).filter(x => res.ans[x.k] !== x.q.a);
  let mh = '';
  wrong.forEach(({ q, k }) => { const it = ITEMS[q.i];
    mh += `<div class="mist"><div class="lbl">${q.k === 'm' ? 'Маъно' : 'Сийға'}</div><div class="ar mid">${esc(it.m)}</div>
      <div class="lbl">Сизнинг жавобингиз:</div><div class="opt bad${q.k === 'm' ? ' plain' : ''}" style="cursor:default">${diffHtml(q, q.o[res.ans[k]], q.o[q.a])}</div>
      <div class="lbl">Тўғриси:</div><div class="opt ok${q.k === 'm' ? ' plain' : ''}" style="cursor:default">${diffHtml(q, q.o[q.a], q.o[res.ans[k]])}</div></div>`; });
  const nm = tgName();
  $app.innerHTML = `<div class="card c"><div class="lbl">${nm ? esc(nm) + ' · ' : ''}${res.part + 1}-қисм</div>
      <div class="bigstar">${stars(s100)}</div><div style="font-size:1.25rem;font-weight:700">Тўғри: ${res.score} / ${res.total}</div><div class="note">⏱ ${mmss(res.seconds)}</div>
      <p id="st" class="note" data-id="${res.id}">${!res.queued ? ST.out : TG() ? ST.wait : ST.net}</p>
      ${wrong.length ? '<button class="btn pri" id="bM">↻ Хатоларни такрорлаш</button>' : ''}
      <button class="btn" id="bL">🏆 Рейтинг</button><button class="btn" id="bHm">Бош саҳифа</button></div>
    ${wrong.length ? `<div class="card"><details open><summary>Хатолар (${wrong.length})</summary>${mh}</details></div>` : ''}`;
  if (window.bM) bM.onclick = mistakes;
  bL.onclick = leaderboard; bHm.onclick = home;
  window.scrollTo(0, 0);
}
function mistakes(){
  if (store.get('rev', null)) return runQ('rev');
  const ids = shuffle(store.get('mist', [])); if (!ids.length) return home();
  store.set('rev', { qs: [...ids.map(tqMeaning), ...ids.filter(hasForms).map(tqForms)], pos: 0, ans: [] });
  runQ('rev');
}
function finishReview(t){
  SCREEN = 'sub';
  const wrongSet = new Set(t.qs.filter((q, k) => t.ans[k] !== q.a).map(q => q.i));
  const reviewed = [...new Set(t.qs.map(q => q.i))];
  // faqat shu takrorda so'ralib, to'g'ri topilgan fe'llar ro'yxatdan chiqadi; keyin qo'shilgan xatolar qoladi
  const left = store.get('mist', []).filter(i => !reviewed.includes(i) || wrongSet.has(i));
  const fixedN = reviewed.filter(i => !wrongSet.has(i)).length;
  store.set('mist', left); store.del('rev'); cloudPush();
  $app.innerHTML = `<div class="card c" style="margin-top:20px">
      <div class="bigstar">${left.length ? '↻' : '🎉'}</div>
      <div style="font-size:1.25rem;font-weight:700">${fixedN} / ${reviewed.length}</div>
      <p class="note">${left.length ? 'Қолди: ' + left.length : 'Хатолар қолмади'}</p>
      ${left.length ? '<button class="btn pri big-btn" id="bA">Яна такрорлаш ▸</button>' : ''}
      <button class="btn" id="bH">Бош саҳифа</button></div>`;
  if (window.bA) bA.onclick = mistakes; bH.onclick = home; window.scrollTo(0, 0);
}

/* ---------- REYTING ---------- */
function drawLb(rows){
  const lb = document.getElementById('lb'); if (!lb) return;
  if (!rows || !rows.length){ lb.innerHTML = '<p class="note">Ҳали ҳеч ким тест топширмаган.</p>'; return; }
  const me = tgName().toLowerCase();
  rows = rows.map(r => { const parts = (r.parts || []).slice(0, NSETS); while (parts.length < NSETS) parts.push(null);
    return { name: String(r.name || ''), parts, sum: Math.round(parts.reduce((s, x) => s + (x || 0), 0) / NSETS * 10) / 10 }; })
    .sort((x, y) => y.sum - x.sum);
  lb.innerHTML = `<table><tr><th>#</th><th>Исм</th><th>Натижа</th></tr>${rows.map((r, k) => {
    const pl = r.parts.map((s, p) => (p + 1) + ':' + (s == null ? '–' : starN(s) + '★')).join('  ');
    return `<tr class="${me && r.name.toLowerCase() === me ? 'me' : ''}"><td>${k + 1}</td><td>${esc(r.name)}<div class="parts">${pl}</div></td>
      <td><b style="font-size:1.15rem">${r.sum}</b> <span class="parts">/100</span><div>${stars(r.sum)}</div><div class="parts">${r.parts.filter(x => x != null).length}/${NSETS} қисм</div></td></tr>`;
  }).join('')}</table>`;
}
async function leaderboard(){
  SCREEN = 'sub';
  $app.innerHTML = `${backBtn()}<h2>🏆 Рейтинг</h2><div class="card" id="lb"><p class="note">Юкланмоқда…</p></div>`;
  wireBack(); window.scrollTo(0, 0);
  const cached = store.get('lb', null); if (cached) drawLb(cached);
  try{
    const r = await fetchT(API + '?a=lb'); const j = await r.json();
    if (!j || !j.ok) throw new Error('lb');
    store.set('lb', j.rows); drawLb(j.rows);
  }catch(e){
    const lb = document.getElementById('lb');
    if (lb && !cached) lb.innerHTML = '<p class="note">Рейтингни юклаб бўлмади. Интернетни текширинг.</p>';
  }
}

/* ---------- LUG'AT ---------- */
const AR_STRIP = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
const arN = s => s.replace(AR_STRIP, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ');
const czN = s => s.toLowerCase().replace(/ҳ/g, 'х').replace(/қ/g, 'к').replace(/ғ/g, 'г').replace(/ў/g, 'у').replace(/[ъь’'ʼ`]/g, '');
let IDX = null;
const idx = () => IDX || (IDX = ITEMS.map(it => ({ ar: arN([it.m, it.mu, it.am, it.ms].filter(Boolean).join(' ')), me: czN(meaning(it)) })));
const lxRow = it => `<div class="lx"><div class="lx-h"><span class="lx-n">№ ${it.n.join(', ')}</span><span class="ar lx-m">${esc(it.m)}</span></div>${it.mu ? formsOnly(it) : ''}<div class="mn">${esc(meaning(it))}</div></div>`;
function lugat(){
  SCREEN = 'sub';
  $app.innerHTML = `${backBtn()}<h2>📖 Луғат</h2><input type="search" id="q" placeholder="Қидириш: арабча ёки маъноси" autocomplete="off" enterkeyhint="search"><div id="lst"></div>`;
  wireBack();
  const draw = () => {
    const s = q.value.trim(); let h = '';
    if (!s){
      for (let p = 0; p < NSETS; p++){ const [a, b] = setRange(p);
        h += `<div class="lx-p">${p + 1}-қисм · № ${ITEMS[a].n[0]}–${ITEMS[b - 1].n[0]}</div>`;
        for (let i = a; i < b; i++) h += lxRow(ITEMS[i]); }
    } else {
      const X = idx(); let test;
      if (/[؀-ۿ]/.test(s)){ const x = arN(s).trim(); test = i => X[i].ar.includes(x); }
      else if (/^\d+$/.test(s)){ const n = +s; test = i => ITEMS[i].n.includes(n); }
      else { const x = czN(/[a-z]/i.test(s) ? cyr(s) : s); test = i => X[i].me.includes(x); }
      ITEMS.forEach((it, i) => { if (test(i)) h += lxRow(it); });
      if (!h) h = '<p class="note c">Топилмади</p>';
    }
    lst.innerHTML = h;
  };
  let tm; q.oninput = () => { clearTimeout(tm); tm = setTimeout(draw, 150); };
  draw(); window.scrollTo(0, 0);
}
// lotin yozuvida qidirilsa kirillga o'giriladi (o' → ў, sh → ш ...)
const CYR_MAP = {a:'а',b:'б',d:'д',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'ц',w:'в'};
const APOS = "'’‘ʻʼ`", VOW = 'aeiouAEIOU';
function cyrWord(w){
  let out = '';
  for (let i = 0; i < w.length; i++){
    const ch = w[i], lo = ch.toLowerCase(), nx = (w[i + 1] || '').toLowerCase();
    if ((lo === 'o' || lo === 'g') && nx && APOS.includes(nx)){ out += lo === 'o' ? 'ў' : 'ғ'; i++; continue; }
    if (lo === 's' && nx === 'h'){ out += 'ш'; i++; continue; }
    if (lo === 'c' && nx === 'h'){ out += 'ч'; i++; continue; }
    if (lo === 'y' && nx === 'o' && APOS.includes(w[i + 2] || '-')){ out += 'й'; continue; }
    if (lo === 'y' && nx && 'oaue'.includes(nx)){ out += {o:'ё', a:'я', u:'ю', e:'е'}[nx]; i++; continue; }
    if (lo === 'e'){ const prev = w[i - 1] || ''; out += !prev || VOW.includes(prev) ? 'э' : 'е'; continue; }
    if (APOS.includes(ch)){ out += i > 0 ? 'ъ' : ''; continue; }
    out += CYR_MAP[lo] || ch;
  }
  return out;
}
const cyr = s => s.replace(/[A-Za-z][A-Za-z'’‘ʻʼ`]*/g, cyrWord);
