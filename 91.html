var QT={"MUBXAB": ["Мубтадо ва хабар", ["Исмий гап икки қисмдан иборат: мубтадо (кимдан/нимадан гап кетяпти) ва хабар (у ҳақида нима дейиляпти). Иккаласи ҳам раф қилинади: الْمَالُ كَثِيرٌ.", "Мубтадо одатда маърифа бўлади (ال билан, алам, замир ёки изофада), хабар кўпинча накра бўлади.", "Хабар уч хил бўлади: муфрад (كَثِيرٌ), жумла (بِلَادُنَا تَحْتَاجُ إِلَيْنَا) ва шибҳи жумла, яъни жар ҳарфи ва мажрур ёки зарф (وَإِلَيْهِ النُّشُورُ).", "Шибҳи жумла хабар олдинга ўтиши мумкин; бу «фақат» маъносини беради: وَإِلَيْهِ النُّشُورُ — «қайта тирилиш фақат Унинг ҳузурига». Мубтадо накра бўлса, хабарни олдинга ўтказиш вожиб: فِي الْبَيْتِ رَجُلٌ.", "Кўпчилик наҳвчилар фикрича мубтадони ибтидо (маънавий омил), хабарни эса мубтадо раф қилади.", "Сарлавҳалардаги исмлар хабари ёки мубтадоси маҳзуф деб таркиб қилинади: (هَذَا) الدَّرْسُ الثَّانِي."]], "LAKINNA": ["لَكِنَّ — إِنَّ нинг синглиси", ["Инна синглилари кана синглиларининг тескариси: мубтадони насб қилади (исми бўлади), хабарни раф қилади (хабари бўлади): إِنَّ الْمَالَ كَثِيرٌ.", "Исми замир бўлса, ҳарфга уланади: لَكِنَّكَ، إِنَّهُ، لَعَلَّنَا.", "لَكِنَّ маъноси — истидрок: олдинги гапдан келиб чиқадиган фикрни тўғрилаш («лекин»).", "Инна синглилари: إِنَّ، أَنَّ (таъкид)، كَأَنَّ (ўхшатиш)، لَكِنَّ (истидрок)، لَيْتَ (орзу)، لَعَلَّ (умид).", "Ташдидсиз لَكِنْ амал қилмайди, ундан кейин оддий гап келади: وَلَكِنْ هَلْ فَكَّرْتَ…"]], "NASB": ["Музорийни насб қилувчи ҳарфлар", ["Музорийни насб қилувчи ҳарфлар: أَنْ، لَنْ، كَيْ، إِذَنْ.", "لَنْ — келаси замонни инкор қилади: لَنْ أَذْهَبَ «бормайман».", "أَنْ — масдарий ҳарф: феъл билан бирга масдар ҳосил қилади: أَرْجُو أَنْ تَعُودَ = أَرْجُو عَوْدَتَكَ.", "Насб аломати — фатҳа; амсилатул хомсада — нуннинг ҳазф бўлиши: لَنْ تَذْهَبُوا.", "Маҳзуф أَنْ билан ҳам насб қилинади: لِ (сабаб), حَتَّى, сабабият фа си ва бошқалардан кейин: جِئْتُ لِأَتَعَلَّمَ."]], "MUDRAF": ["Музорийнинг рафи", ["Музорий феъли уни насб ёки жазм қилувчи сўз бўлмаса раф қилинади.", "Раф аломати — замма: أَعُودُ، تَعْمَلُ.", "Охири و ёки ي бўлса, замма оғир бўлгани учун айтилмайди (тақдирий): أَرْجُو، أَمْشِي; лекин фатҳа кўринади: لَنْ أَرْجُوَ.", "Амсилатул хомсада раф аломати — нуннинг жойида туриши: تَعْمَلُونَ، تَعْمَلِينَ.", "Жазм қилувчилар: لَمْ، لَمَّا، амр ломи، наҳй لَا си ва шарт сўзлари (إِنْ، مَنْ، مَا…)."]], "AMR": ["Амр феълининг биноси", ["Амр феъли доим мабний бўлади; музорийсининг жазмдаги аломатига мабний:", "• охири саҳиҳ бўлса — сукунга: اكْتُبْ", "• охири иллат ҳарфи бўлса — иллат ҳарфининг ҳазфига: امْشِ، ادْعُ، اسْعَ", "• амсилатул хомсадан бўлса — ن нинг ҳазф бўлишига: امْشُوا، كُلُوا، اكْتُبِي", "Амсилатул хомса: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ — рафда ن билан, насб ва жазмда ن тушади.", "Жам вовидан кейин ёзиладиган алиф (фарқлаш ҳарфи) ўқилмайди: امْشُوا.", "أَكَلَ дан амр қисқа: كُلْ، كُلُوا (худди шундай: أَخَذَ → خُذْ)."]], "MANQUS": ["Исм манқус", ["Охири ي бўлиб, олдидаги ҳарф касрали исм: الثَّانِي، الْقَاضِي.", "Раф ва жарда ҳаракат тақдирий (оғирлик учун), насбда фатҳа кўринади: رَأَيْتُ الْقَاضِيَ.", "Накра бўлса, раф ва жарда ي тушиб, танвин олади: ثَانٍ، قَاضٍ."]], "SIFAT": ["Сифат (наът)", ["Сифат мавсуфига тўрт нарсада эргашади: эъроб, маърифа/накра, жинс (музаккар/муаннас), сон.", "Мисол: الدَّرْسُ الثَّانِي، اللَّهُ الْعَظِيمُ.", "Ақлсиз нарсаларнинг кўплигига сифат муаннас бирликда келади: بِلَادٍ غَرِيبَةٍ."]], "MULHAQ": ["Жам музаккар солимга мулҳақ сўзлар", ["Ўнликлар (عِشْرُونَ … تِسْعُونَ), шунингдек أُولُو، أَهْلُونَ، سِنُونَ، بَنُونَ жам музаккар солимдек турланади.", "Рафда و, насб ва жарда ي: جَاءَ عِشْرُونَ، رَأَيْتُ عِشْرِينَ.", "Тартиб сонлари: الْحَادِي وَالْعِشْرُونَ … الثَّانِي وَالتِّسْعُونَ — бирлик فَاعِلٍ вазнида, ўнлик و билан атф қилинади."]], "ATF": ["Атф ҳарфлари", ["Маътуф ўзидан олдингисига эъробда эргашади: عَلَى دِينِهِمْ وَثَقَافَتِهِمْ.", "وَ — жамлаш («ва»)؛ فَ — кетма-кет, тез؛ ثُمَّ — кетма-кет, орада вақт бор؛ أَوْ — «ёки» (танлаш)؛ أَمْ — «ёки» (саволда)؛ بَلْ — «балки»؛ لَا — «эмас»."]], "MUTLAQ": ["Мафъулун мутлақ", ["Феълнинг ўз масдари: феълни таъкидлайди, турини ёки сонини билдиради: شَكَرْتُهُ شُكْراً.", "Феъли кўпинча ҳазф қилинади: شُكْراً، عَفْواً، صَبْراً، حَمْداً.", "Унинг ўрнига ўтадиганлар (наиб): сон (مَرَّتَيْنِ), كُلٌّ ва بَعْضٌ (كُلَّ الشُّكْرِ), сифати."]], "GHAYR": ["Ғайри мунсариф исм", ["Танвин олмайди ва жарда касра ўрнига фатҳа олади: مَرَرْتُ بِمَسَاجِدَ.", "Икки ҳолатда касра олади: ال билан келса (فِي الْمَسَاجِدِ) ёки музоф бўлса (فِي مَنَاكِبِهَا).", "Баъзи сабаблари: мунтаҳал жумуъ вазни (مَفَاعِلُ، مَفَاعِيلُ)، أَفْعَلُ вазнидаги сифат، муаннас алифи (صَحْرَاءُ)، فَعْلَانُ сифат (عَطْشَانُ) ва кўп атоқли отлар (فَاطِمَةُ، إِبْرَاهِيمُ)."]], "PRON": ["Муттасил замирлар", ["Замирлар доим мабний; ўрни қаерга уланганига қараб:", "• исмга — музофун илайҳ, жар ўринда: رَاتِبُكَ", "• феълга — мафъулун биҳ, насб ўринда: أَزُورُهُمْ (ёки бориз фоил замири: فَكَّرْتُ، اغْتَرَبُوا)", "• жар ҳарфига — мажрур, жар ўринда: إِلَيْنَا، فِيكَ", "• إِنَّ синглисига — унинг исми, насб ўринда: لَكِنَّكَ", "هُ، هُمْ، هُمَا، هُنَّ — касра ёки ي дан кейин касра олади: رِزْقِهِ، دِينِهِمْ، فِيهِمْ."]], "IDAFA": ["Изофа", ["Музоф танвин ва ال олмайди: خَارِجَ وَطَنِي، خَمْسَ سَنَوَاتٍ.", "Музофун илайҳ доим жар қилинади.", "Музофнинг ўз эъроби гапдаги ўрнига қараб (мубтадо, фоил, зарф…)."]], "ZARF": ["Зарф (мафъулун фийҳ)", ["Иш-ҳаракатнинг вақти ёки жойини билдиради, «-да» маъносини беради; насб қилинади.", "Зарф замон: يَوْمَ، لَيْلَةَ، صَبَاحاً; зарф макон: خَارِجَ، أَمَامَ، فَوْقَ، عِنْدَ، مَعَ.", "Баъзи зарфлар мабний: هُنَا، هُنَاكَ، إِذَا، الْآنَ، حَيْثُ — насб ўринда.", "Зарф ўрнига ўтадиганлар: сон (خَمْسَ سَنَوَاتٍ), зарфнинг сифати (طَوِيلاً — асли زَمَناً طَوِيلاً), كُلٌّ ва بَعْضٌ.", "Зарф ҳамда жар ҳарфи ва мажрур бирор феълга ёки феълдек амал қиладиган сўзга боғланади (мутааллиқ)."]], "ISHARA": ["Исм ишоралар", ["Яқин учун: هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ.", "Узоқ учун: ذَلِكَ، تِلْكَ، أُولَئِكَ.", "ذَلِكَ = ذَا + لِ (узоқлик ломи) + كَ (хитоб ҳарфи).", "Жой учун: هُنَا (бу ерда)، هُنَاكَ / هُنَالِكَ (у ерда).", "هَذَانِ ва هَاتَانِ тасниядек турланади, қолганлари мабний."]], "FAIL": ["Фоил", ["Ишни бажарувчи; доим раф қилинади ва феълдан кейин келади.", "Феъл олдин келса, фоил кўплик бўлса ҳам феъл бирликда қолади: جَاءَ الطُّلَّابُ.", "Фоил зоҳир (алоҳида исм), бориз муттасил замир (فَكَّرْتُ) ёки мустатир замир (هُوَ، أَنَا) бўлади.", "اللَّهُ сўзи таркибда ҳурмат учун «лафзи жалола» (لَفْظُ الْجَلَالَةِ) деб аталади."]], "MAFUL": ["Мафъулун биҳ", ["Иш ўтадиган нарса; насб қилинади: تَصْحَبَ أَوْلَادَكَ.", "Баъзи феъллар икки мафъулун биҳ олади:", "• «айлантирмоқ» маъносидаги جَعَلَ، صَيَّرَ، اتَّخَذَ — мафъуллари асли мубтадо ва хабар: الْأَرْضُ ذَلُولٌ → جَعَلَ الْأَرْضَ ذَلُولًا", "• «бермоқ» маъносидаги أَعْطَى، مَنَحَ ва «гумон қилмоқ» маъносидаги ظَنَّ، حَسِبَ."]], "JARR": ["Жар ҳарфлари", ["Ўзидан кейинги исмни жар қилади: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِ، لِ، كَ، حَتَّى، رُبَّ، مُنْذُ.", "إِلَى ва عَلَى замирга уланганда алиф ي га айланади: إِلَيْهِ، عَلَيْكَ.", "لِ замир билан фатҳа олади: لَكَ، لَهُ، لَكُمْ (фақат ي билан: لِي).", "لِ + ال: алиф ёзилмайди — لِلْعَمَلِ.", "Жар ҳарфи ва мажрур бирор феълга ёки феълга ўхшаш сўзга боғланади (мутааллиқ); бундай сўз бўлмаса — маҳзуф (ҳазф қилинган) сўзга (хабар, сифат ёки ҳол бўлиб)."]], "HAL": ["Ҳол", ["Иш пайтидаги ҳолатни билдиради, «қандай?» саволига жавоб беради; насб қилинади.", "Ҳол кўпинча накра, зул ҳол эса маърифа бўлади.", "Битта зул ҳолга бир нечта ҳол келиши мумкин: تَعُودَ سَالِماً غَانِماً.", "Ҳол жумла ҳам бўлади: جَاءَ وَهُوَ يَضْحَكُ.", "كَيْفَ — тўлиқ феълдан олдин келса ҳол (كَيْفَ تُحَافِظُ؟), мубтадодан олдин келса хабар (كَيْفَ حَالُكَ؟)."]], "ISTIF": ["Савол сўзлари", ["Ҳарфлар: هَلْ ва ҳамза (أَ). هَلْ нинг жавоби — نَعَمْ ёки لَا.", "Исмлар: مَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيُّ — гапда ўрни бор (мубтадо, хабар, ҳол, мафъулун биҳ…).", "Савол исмлари мабний, фақат أَيُّ мўъроб."]], "MAWSUL": ["Исм мавсул", ["الَّذِي، الَّتِي، اللَّذَانِ، اللَّتَانِ، الَّذِينَ، اللَّاتِي; умумий: مَنْ، مَا.", "Ўзидан кейинги жумла — сила, эъробдан унга ўрин йўқ.", "Силада мавсулга қайтувчи замир бўлади: هُوَ الَّذِي جَعَلَ — جَعَلَ даги мустатир هُوَ.", "اللَّذَانِ ва اللَّتَانِ тасниядек мўъроб, қолганлари мабний."]], "DAMIR": ["Мунфасил замирлар", ["أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.", "Ҳаммаси мабний; гапда раф ўринда келади (мубтадо, хабар…).", "Насб ўрни учун إِيَّا билан: إِيَّاكَ نَعْبُدُ."]], "INNA": ["إِنَّ ва أَنَّ", ["إِنَّ — таъкид ҳарфи: мубтадони насб қилади (исми бўлади), хабарни раф қилади (хабари бўлади): إِنَّ الْمَرْأَةَ نِصْفُ الْمُجْتَمَعِ (51-дарс).", "يَقُولُ / قَالَ дан кейинги гап бошида إِنَّ касра билан келади: يَقُولُ: إِنَّ…", "أَنَّ — ҳам насб қилади, ҳам ўзи, исми ва хабари билан масдар ўрнида бўлади: يَرَى أَنَّ الْعَمَلَ حَقٌّ = يَرَى حَقِّيَّةَ الْعَمَلِ.", "Синглилари: كَأَنَّ (ўхшатиш)، لَكِنَّ (истидрок)، لَيْتَ (орзу)، لَعَلَّ (умид)."]], "BADAL": ["Бадал", ["Бадал олдинги сўзнинг (мубдалун минҳ) ўрнига туради ва унга эъробда эргашади (91-дарс).", "Бу гапда «уч гуруҳ» (ثَلَاثِ فِرَقٍ) дан кейин гуруҳлар бирма-бир саналган: فَرِيقٍ … وَفَرِيقٍ … وَفَرِيقٍ — шунинг учун улар ҳам мажрур."]], "MAMNU": ["Ғайри мунсариф", ["Ғайри мунсариф исм танвин олмайди ва жар ҳолида касра ўрнига фатҳа олади: بِفَرِيقٍ آخَرَ.", "آخَرُ — сифат ва феъл вазнида (أَفْعَلُ) бўлгани учун ғайри мунсариф."]], "AMMA": ["أَمَّا … فَـ", ["أَمَّا — шарт ва тафсил ҳарфи: «… га келсак».", "Ундан кейинги исм кўпинча мубтадо бўлади, жавоби фа (فَـ) билан бошланади: أَمَّا الْفَرِيقُ الثَّالِثُ فَيَرَى…"]]};
